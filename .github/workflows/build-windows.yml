name: Build Windows EXE

on:
  push:
    branches: [main, master, stages1-6, feature/room-counting]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python (for node-gyp)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (skip native scripts)
        run: npm install --ignore-scripts

      - name: Rebuild native modules for Electron
        run: npx electron-builder install-app-deps

      - name: Run tests
        run: npm test

      - name: Build renderer
        run: npm run build:renderer

      - name: Build Electron (NSIS + Portable)
        run: npx electron-builder --win --config build/electron-builder.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Difrag-Windows-4821
          path: |
            dist/Difrag-Setup-*.exe
            dist/Difrag-Portable-*.exe
          if-no-files-found: warn

      - name: Publish release (direct download links)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/room-counting'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          sha256sum Difrag-Setup-*.exe Difrag-Portable-*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAG="build-4821-${{ github.run_number }}"; FLAG="--latest"; TITLE="Difrag 1.0.0 (Build 4821) #${{ github.run_number }}"
            NOTES="Windows installer and portable build. Verify with SHA256SUMS.txt."
          else
            # test build from a feature branch: pre-release, never marked as the latest release
            TAG="test-room-counting-${{ github.run_number }}"; FLAG="--prerelease"; TITLE="TEST (room counting branch) #${{ github.run_number }}"
            NOTES="Test build from branch feature/room-counting (commit ${{ github.sha }}). Not for production. Verify with SHA256SUMS.txt."
          fi
          gh release create "$TAG" Difrag-Setup-*.exe Difrag-Portable-*.exe SHA256SUMS.txt \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "$TITLE" --notes "$NOTES" $FLAG

      - name: List dist
        run: dir dist
        shell: cmd
